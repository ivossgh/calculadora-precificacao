<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Item da Venda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mb-5">

<div class="card p-4 shadow-sm">
    <h2>Cadastrar Item da Venda</h2>

    <form method="POST" th:action="@{/cadastrar-itemvenda}">


        <div class="mb-3">
            <label class="form-label">Selecione a Venda</label>
            <select class="form-select" name="vendaId" required>
                <option value="">Selecione</option>
                <option th:each="v : ${vendas}"
                        th:value="${v.id}"
                        th:text="${v.id}">
                </option>
            </select>
        </div>


        <div class="mb-3">
            <label class="form-label">Selecione o Serviço</label>
            <select class="form-select" name="servicoId" required>
                <option value="">Selecione</option>
                <option th:each="s : ${servicos}"
                        th:value="${s.id}"
                        th:text="${s.nome}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Valor Unitário</label>
            <input type="number" class="form-control" name="valorUnitario" step="0.01" min="0" required>
        </div>


        <div class="mb-3">
            <label class="form-label">Quantidade</label>
            <input type="number" class="form-control" name="quantidade" min="1" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Cadastrar Item</button>
    </form>
</div>

</body>
</html>
