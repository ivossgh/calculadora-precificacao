<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itens da Venda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Itens da Venda</h2>
        <a href="/cadastrar-itemvenda" class="btn btn-success">Adicionar Item</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID (RESUMO)</th>
                <th>Venda</th>
                <th>Serviço</th>
                <th>Valor Unitário</th>
                <th>Quantidade</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${itens}">
                <td th:text="${#strings.substring(item.id, 0, 8)}"></td>
                <td th:text="${#strings.substring(item.venda.id, 0, 8)}"></td>
                <td th:text="${item.servico.nome}"></td>

                <td th:text="'R$ ' + ${#numbers.formatDecimal(item.valorUnitario, 1, 2)}"></td>

                <td th:text="${item.quantidade}"></td>

                <td th:text="'R$ ' + ${#numbers.formatDecimal(item.valorTotal, 1, 2)}"></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
