<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Vendas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Vendas</h2>
        <a href="/cadastrar-venda" class="btn btn-success">Nova Venda</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID (RESUMO)</th>
                <th>Empresa</th>
                <th>Vendedor</th>
                <th>Data</th>
                <th>Desconto</th>
                <th>Valor Total</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="venda : ${vendas}">
                <td th:text="${#strings.substring(venda.id, 0, 8)}"></td>
                <td th:text="${venda.empresa.nomeEmpresa}"></td>
                <td th:text="${venda.vendedor.nomeConsultor}"></td>
                <td th:text="${#temporals.format(venda.dataVenda, 'dd/MM/yyyy')}"></td>
                
                <td th:text="'R$ ' + ${#numbers.formatDecimal(venda.desconto, 1, 2)}"></td>
                
                <td th:text="'R$ ' + ${#numbers.formatDecimal(venda.valorTotal, 1, 2)}"></td>

                <td>
                    <a th:href="@{/lista-itens}" class="btn btn-info btn-sm">Ver Itens</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
