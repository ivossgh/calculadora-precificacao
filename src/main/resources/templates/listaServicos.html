<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Serviços Oferecidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Serviços</h2>
        <a href="/cadastrar-servico" class="btn btn-success">Adicionar Novo Serviço</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th scope="col">ID (RESUMO)</th>
                <th scope="col">Serviço</th>
                <th scope="col">Categoria do Serviço</th>
                <th scope="col">Valor do Serviço</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="servico : ${servicos}">
                <td th:text="${#strings.substring(servico.id, 0, 8)}"></td>
                <td th:text="${servico.nome}"></td> 
                <td th:text="${servico.categoriaServico.descricao}"></td>
                <!-- Formatando para ficar assim R$ 1.500,00-->
                <td th:text="'R$ ' + ${#numbers.formatDecimal(servico.valorBase, 1, 2)}"></td>
                <td>
                    <a th:href="@{/edit/{id}(id=${servico.id})}" class="btn btn-warning btn-sm">Editar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
