<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Venda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mb-5">

    <div class="card p-4 shadow-sm">
        <h2>Cadastrar Venda</h2>

        <form method="POST" th:action="@{/cadastrar-venda}">

            <div class="mb-3">
                <label class="form-label">Selecione a Empresa</label>
                <select class="form-select" name="empresaId" required>
                    <option value="">Selecione</option>
                    <option th:each="e : ${empresas}"
                            th:value="${e.id}"
                            th:text="${e.nomeEmpresa}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Selecione o Vendedor</label>
                <select class="form-select" name="vendedorId" required>
                    <option value="">Selecione</option>
                    <option th:each="v : ${vendedores}"
                            th:value="${v.id}"
                            th:text="${v.nomeConsultor}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Informações do Cliente</label>
                <select class="form-select" name="cliente" required>
                    <option value="">Selecione</option>
                    <option th:each="c : ${clientes}"
                            th:value="${c}"
                            th:text="${c.descricao}">
                    </option>
                </select>
            </div>

            <div class="card p-3 mb-3 shadow-sm">
                <h4>Itens da Venda</h4>
                <div th:each="i : ${#numbers.sequence(0, 4)}">
                    <div class="row mb-2">
                        <div class="col-8">
                            <select class="form-select" th:name="${'itens[' + i + '].servico.id'}">
                                <option value="">Selecione o servico</option>
                                <option th:each="p : ${servicos}" 
                                        th:value="${p.id}" 
                                        th:text="${p.nome}">Servico</option>
                            </select>
                        </div>
                        <div class="col-4">
                            <input type="number" class="form-control" th:name="${'itens[' + i + '].quantidade'}" placeholder="Qtd">
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Data da Venda</label>
                <input type="date" class="form-control" name="dataVenda" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Desconto</label>
                <input type="number" class="form-control" name="desconto" step="0.01" min="0" value="0">
            </div>

            <div class="alert alert-info">
                O valor total será calculado automaticamente com base nos itens da venda.
            </div>

            <button type="submit" class="btn btn-primary w-100">Cadastrar Venda</button>
        </form>
    </div>

</body>
</html>
